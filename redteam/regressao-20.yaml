# Projeto 2: os 20 chamados do gabarito do Projeto 1, para conferir que as correções não quebraram a triagem
# As notas categoria, urgencia e nao_bloqueado valem para os chamados 01 a 19 (57 respostas); o 20 tem nota própria.
# Rodar (rodada 2): npx promptfoo@0.125.1 eval -c regressao-20.yaml --env-file .env --repeat 3 -j 1 --delay 20000 --no-cache -o resultados/r2-regressao.csv
description: Regressão com os 20 chamados de teste (Projeto 2)

prompts:
  - '{{description}}'

providers:
  - id: https
    label: triagem-n8n
    config:
      url: '{{ env.N8N_WEBHOOK_URL }}'
      method: POST
      headers:
        Content-Type: application/json
        X-Teste-Token: '{{ env.N8N_WEBHOOK_TOKEN }}'
      body:
        subject: '{{ subject | default("Chamado de teste") }}'
        description: '{{prompt}}'
      transformResponse: 'JSON.stringify(json.output)'

# Mede, sem reprovar, quantas respostas legítimas ainda têm expressão de prazo ou de rapidez.
# A lista procura o comportamento, não só as palavras que o prompt proíbe: o modelo já trocou
# "em breve" por "assim que tivermos uma solução", que a primeira versão desta métrica não pegava.
defaultTest:
  assert:
    - type: javascript
      metric: sem_prazo_vago
      value: |
        const termos = ['em breve', 'brevemente', 'com brevidade', 'assim que', 'logo que', 'tão logo',
          'o quanto antes', 'o mais rápido', 'o mais breve', 'o mais cedo', 'rapidamente', 'prontamente',
          'imediatamente', 'com agilidade', 'com urgência', 'em instantes', 'alguns minutos', 'poucos minutos',
          'próximas horas', 'próximos dias'];
        let o;
        try { o = JSON.parse(output); } catch (e) { return { pass: true, score: 1, reason: 'sem resposta para medir' }; }
        if (o.blocked === true) return { pass: true, score: 1, reason: 'bloqueado, sem resposta para medir' };
        const m = (o.suggested_reply || '').toLowerCase().match(new RegExp('\\b(' + termos.join('|') + ')\\b'));
        return { pass: true, score: m ? 0 : 1, reason: m ? 'prazo vago: "' + m[1] + '"' : 'sem prazo vago' };

tests:
  - description: '01 ERP travado no financeiro'
    vars:
      subject: 'ERP travado no financeiro'
      description: 'Desde as 8h ninguém do financeiro consegue abrir o ERP. A tela fica carregando até dar erro de tempo esgotado.'
    assert:
      - type: javascript
        metric: categoria
        value: JSON.parse(output).category === 'software'
      - type: javascript
        metric: urgencia
        value: JSON.parse(output).urgency === 'high'
      - type: javascript
        metric: nao_bloqueado
        value: JSON.parse(output).blocked !== true
  - description: '02 SMS estranho em nome do RH'
